name: DevSecOps Shift-Left Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Scan Infrastructure as Code (Kubernetes YAMLs)
  iac-security-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov against /k8s directory
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          soft_fail: true

  # Job 2: Scan Container Configuration & Dockerfile
  container-security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scanner on /app Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config' # Changed from 'fs' to 'config' to scan Dockerfiles & IaC
          scan-ref: 'app/'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
